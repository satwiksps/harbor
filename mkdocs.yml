site_name: Harbor
site_description: Setup, operations, and engineering documentation for the Harbor MCP gateway.
site_url: !ENV [DOCS_SITE_URL, ""]
docs_dir: docs
site_dir: .runtime/docs-site
strict: true

theme:
  name: material
  custom_dir: docs/theme
  language: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Overview: index.md
  - Get started:
      - Installation: getting-started.md
      - Console guide: user-guide.md
      - External MCP clients: external-clients.md
  - Reference:
      - Architecture: system-design.md
      - API and configuration: CONTRACT.md
      - Security: threat-model.md
  - Maintain:
      - Development and testing: development.md
      - Deployment and recovery: operations.md
  - Assets and licenses: brand-notes.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

exclude_docs: |
  requirements.in
  requirements.txt
  theme/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

copyright: Harbor documentation.
