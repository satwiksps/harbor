name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.23
      - run: uv venv .runtime/docs-venv --python 3.12
      - run: uv pip sync docs/requirements.txt --require-hashes --python .runtime/docs-venv/bin/python
      - run: .runtime/docs-venv/bin/python scripts/build-docs.py
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --memory=256m --memory-swap=256m
          --health-cmd="pg_isready -U test -d test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.23
      - run: uv sync --frozen
      - run: uv run ruff check backend upstreams tests scripts examples
      - run: uv run pytest -q
      - name: Offline credential preparation checks
        run: uv run python scripts/test-secret-preparation.py
      - name: Offline local recovery guards
        shell: pwsh
        run: ./scripts/test-local-recovery.ps1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci && npm run build
        working-directory: dashboard
      - name: Install browser test runtime
        run: uv run playwright install --with-deps chromium
      - name: Check console interactions and responsive accessibility
        env:
          HARBOR_URL: http://127.0.0.1:5175
        run: |
          npm --prefix dashboard run preview -- --host 127.0.0.1 --port 5175 > /tmp/harbor-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$HARBOR_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$HARBOR_URL" > /dev/null
          uv run python -m tests.browser_observability
          uv run python -m tests.browser_accessibility
          uv run python -m tests.browser_console
          uv run python -m tests.browser_auth_resilience
          uv run python -m tests.browser_chat_resilience
          uv run python -m tests.browser_management_resilience
          uv run python -m tests.browser_activity_resilience
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Helm and verify checksum
        run: |
          curl -fsSLO https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.1-linux-amd64.tar.gz
      - run: ./linux-amd64/helm lint deploy/chart -f deploy/values-local.yaml
      - run: ./linux-amd64/helm lint deploy/chart -f deploy/values-prod.yaml
      - run: ./linux-amd64/helm template harbor deploy/chart -f deploy/values-prod.yaml > /tmp/harbor-rendered.yaml
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t harbor:ci .
      - name: Verify authentication memory budget
        run: python scripts/verify_auth_budget.py --image harbor:ci
      - run: docker build -t harbor-dashboard:ci -f dashboard/Dockerfile .
      - run: docker build -t harbor-wordpress:ci docker/wordpress
      - name: Verify storefront branding migration preserves data
        run: docker run --rm --network none --entrypoint php -v "$PWD:/workspace:ro" harbor-wordpress:ci /workspace/scripts/test-wordpress-brand.php
