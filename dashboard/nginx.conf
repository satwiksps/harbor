server {
    # Invitation URLs contain single-use credentials. Tool audit records live in PostgreSQL.
    access_log off;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /health/live { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /health/ready { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    # Ingress routes /api and /mcp directly to the backend service.
    # Never serve index.html for a misrouted API call.
    location /api { default_type application/json; return 502 '{"detail":"API route is unavailable. Check the ingress configuration."}'; }
    location /mcp { default_type application/json; return 502 '{"detail":"MCP route is unavailable. Check the ingress configuration."}'; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location /fonts/ { expires 30d; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
