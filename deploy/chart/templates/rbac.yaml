apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-gateway
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-upstream-secret-editor
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.secrets.upstreamCredentials | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-upstream-secret-editor
subjects:
  - kind: ServiceAccount
    name: harbor-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: harbor-upstream-secret-editor
  apiGroup: rbac.authorization.k8s.io
