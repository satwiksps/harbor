apiVersion: v1
kind: ServiceAccount
metadata:
  name: commerce-gateway
  labels:
    {{- include "commerce.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commerce-upstream-secret-editor
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.secrets.upstreamCredentials | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commerce-upstream-secret-editor
subjects:
  - kind: ServiceAccount
    name: commerce-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: commerce-upstream-secret-editor
  apiGroup: rbac.authorization.k8s.io
